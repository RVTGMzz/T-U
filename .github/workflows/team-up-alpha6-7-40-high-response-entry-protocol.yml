name: Team Up v0.2.0-alpha.6.7.40 HIGH Response Entry Protocol

on:
  push:
    branches:
      - v0.2-alpha6-7-40-high-response-preparation
    paths:
      - 'tools/materialize_alpha6740.py'
      - 'tools/build_alpha6740.py'
      - '.github/workflows/team-up-alpha6-7-40-high-response-entry-protocol.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: '6.0.x'

      - name: Materialize Alpha 6.7.40 HIGH response / entry protocol source
        run: python3 tools/materialize_alpha6740.py

      - name: Build, audit and package Alpha 6.7.40
        run: python3 tools/build_alpha6740.py

      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.40 HIGH response entry protocol [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.40 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-40-high-response-entry-protocol
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.40_HIGH_RESPONSE_ENTRY_PROTOCOL_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.40_HIGH_RESPONSE_ENTRY_PROTOCOL_TEST.sha256.txt
            BUILD_LOG_ALPHA6740.txt
            HIGH_RESPONSE_ENTRY_PROTOCOL_AUDIT_ALPHA6740.md
            SMOKE_TEST_V0_2_ALPHA6_7_40_HIGH_RESPONSE_ENTRY_PROTOCOL_VI.txt
          if-no-files-found: error
