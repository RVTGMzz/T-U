name: Team Up v0.2.0-alpha.6.6.9 Companion Flicker + Health Bars

on:
  push:
    branches: [ v0.2-alpha6-6-9-companion-flicker-health-bars ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.9 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha669.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          alpha663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          alpha669 = (root/'ModEntry.Alpha669.cs').read_text(encoding='utf-8')
          pelipper = (root/'Core/PelipperTownCompatibilityService.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          tile = (root/'Core/PartyTileSafety.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          codex = (root/'UI/CodexBrowserMenu.cs').read_text(encoding='utf-8')
          config = (root/'ModConfig.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.9</Version>' in project
          assert 'RegisterAlpha669HotfixEvents();' in mod
          assert 'build: v0.2.0-alpha.6.6.9' in mod

          for token in [
              'RenderedWorld',
              'PartyHealthBarWidthAlpha669 = 52',
              'PartyHealthBarCombatRadiusAlpha669 = 10f',
              'Progression.GetMaxHealth(member)',
              'member.CurrentHealth',
              'member.IsDowned',
              'hpText = isDowned ? "DOWN"',
          ]:
              assert token in alpha669, token

          for token in [
              'DeploymentStateKey = "Ronvotri.TeamUp/DeploymentState"',
              'DeploymentOwnerKey = "Ronvotri.TeamUp/DeploymentOwner"',
              'RestoreLegacySuppression(actor)',
              'actor.modData[DeploymentStateKey] = suppressed ? "Standby" : "Active"',
              'bool clearAllDeployment = active.Count == 0;',
          ]:
              assert token in pelipper, token

          start = pelipper.index('    public static void SetSuppressed')
          end = pelipper.index('    private static void RestoreLegacySuppression', start)
          set_body = pelipper[start:end]
          for forbidden in ['TrySetInvisible', 'actor.Halt()', 'actor.controller', 'actor.temporaryController']:
              assert forbidden not in set_body, forbidden

          assert 'TrySetInvisible(actor, originalInvisible)' in pelipper  # legacy one-shot repair only
          assert 'FindLandOpenNear' in follow
          assert 'PartyTileSafety.IsWalkableLandOrBridge(owner.currentLocation, npc.Tile)' in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          for token in ['CombatPathRetryCooldownTicks = 24', 'CombatMovementPulseTicks = 3', 'ShouldExcludeFromTeamUpCombat(monster)', 'PartyTileSafety.IsWalkableLandOrBridge(location, tile)']:
              assert token in combat, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat
          for token in ['isWaterTile(x, y)', 'GetLayer("Buildings")', 'isTilePassable(tile)']:
              assert token in tile, token

          for token in ['e.Button.IsActionButton()', 'e.Button.IsUseToolButton()', 'routedButton = Buttons.A', 'routedButton = Buttons.X']:
              assert token in alpha663, token
          for token in ['ControllerActivationDebounceMs = 180', 'ControllerMouseEchoSuppressionMs = 260', 'DoubleClickWindowMs = 450']:
              assert token in equipment, token
          assert 'MoveVertical(2)' not in codex
          assert 'MoveVertical(-2)' not in codex

          assert 'public int MaxPartyMembers { get; set; } = 6;' in config
          assert 'public int MaxActiveLinkedCompanions { get; set; } = 2;' in config

          print('Alpha 6.6.9 source acceptance PASS')
          print('Pelipper source render/movement authority PASS')
          print('Legacy visibility one-shot repair PASS')
          print('NPC world health bars PASS')
          print('6.6.7 performance + 6.6.8 land-safe regression PASS')
          print('Switch input + Codex one-row regression PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.9_COMPANION_FLICKER_HEALTH_BARS_HOTFIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.9_COMPANION_FLICKER_HEALTH_BARS_HOTFIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.9' BUILD_LOG.txt
          grep -q 'PELIPPER SOURCE RENDER AUTHORITY: ENABLED' BUILD_LOG.txt
          grep -q 'LEGACY VISIBILITY REPAIR: ENABLED' BUILD_LOG.txt
          grep -q 'NPC WORLD HEALTH BARS: ENABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.9 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha669.ps1 SMOKE_TEST_V0_2_ALPHA6_6_9_COMPANION_FLICKER_HEALTH_BARS_VI.txt .github/workflows/team-up-alpha6-6-9-companion-flicker-health-bars.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.9 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-9-companion-flicker-health-bars
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-9-companion-flicker-health-bars
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.9_COMPANION_FLICKER_HEALTH_BARS_HOTFIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.9_COMPANION_FLICKER_HEALTH_BARS_HOTFIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_9_COMPANION_FLICKER_HEALTH_BARS_VI.txt
          if-no-files-found: error
