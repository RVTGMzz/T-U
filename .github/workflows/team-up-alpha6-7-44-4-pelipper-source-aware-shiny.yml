name: Team Up v0.2.0-alpha.6.7.44.4 Pelipper Source-Aware Shiny

on:
  push:
    branches:
      - v0.2-alpha6-7-44-4-pelipper-source-aware-shiny
    paths:
      - 'tools/hotfix_alpha6744_4_source_aware_shiny.py'
      - 'tools/build_alpha6744_4.py'
      - 'tools/fix_alpha6744_4_audit_scope.py'
      - '.github/workflows/team-up-alpha6-7-44-4-pelipper-source-aware-shiny.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Apply Alpha 6.7.44.4 source-aware Shiny hotfix
        run: python3 tools/hotfix_alpha6744_4_source_aware_shiny.py
      - name: Fix Alpha 6.7.44.4 audit scope
        run: python3 tools/fix_alpha6744_4_audit_scope.py
      - name: Build, audit and package Alpha 6.7.44.4
        run: python3 tools/build_alpha6744_4.py
      - name: Commit verified source-aware Shiny source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No hotfix source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.44.4 source-aware Shiny [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload Alpha 6.7.44.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-4-pelipper-source-aware-shiny
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44.4_PELIPPER_SOURCE_AWARE_SHINY_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44.4_PELIPPER_SOURCE_AWARE_SHINY_TEST.sha256.txt
            BUILD_LOG_ALPHA6744_4.txt
            PELIPPER_SOURCE_AWARE_SHINY_AUDIT_ALPHA6744_4.md
          if-no-files-found: error
