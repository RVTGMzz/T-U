name: Team Up v0.2.0-alpha.6.7.23 Capture Ceasefire Hardening

on:
  push:
    branches:
      - v0.2-alpha6-7-23-capture-ceasefire-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x

      - name: Materialize Alpha 6.7.23 capture ceasefire source
        run: python3 tools/materialize_alpha6723.py

      - name: Build, audit and package Alpha 6.7.23
        run: python3 tools/build_alpha6723.py

      - name: Materialize verified source back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.23 capture ceasefire hardening [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.23 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-23-capture-ceasefire-hardening
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.23_CAPTURE_CEASEFIRE_HARDENING_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.23_CAPTURE_CEASEFIRE_HARDENING_TEST.sha256.txt
            BUILD_LOG_ALPHA6723.txt
            CAPTURE_CEASEFIRE_AUDIT_ALPHA6723.md
            SMOKE_TEST_V0_2_ALPHA6_7_23_CAPTURE_CEASEFIRE_VI.txt
          if-no-files-found: error
