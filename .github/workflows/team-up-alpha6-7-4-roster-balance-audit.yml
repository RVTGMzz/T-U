name: Team Up v0.2.0-alpha.6.7.4 Roster Balance Audit

on:
  push:
    branches:
      - v0.2-alpha6-7-4-roster-balance-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x

      - name: Materialize Alpha 6.7.4 source
        run: |
          python3 tools/materialize_alpha674.py
          python3 tools/fix_alpha674_balance.py

      - name: Build, audit and package Alpha 6.7.4
        run: python3 tools/build_alpha674.py

      - name: Materialize verified source back to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.4 source [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-4-roster-balance-audit
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.4_ROSTER_BALANCE_AUDIT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.4_ROSTER_BALANCE_AUDIT_TEST.sha256.txt
            BUILD_LOG_ALPHA674.txt
            ROSTER_AUDIT_ALPHA674.md
            SMOKE_TEST_V0_2_ALPHA6_7_4_ROSTER_BALANCE_AUDIT_VI.txt
          if-no-files-found: error
