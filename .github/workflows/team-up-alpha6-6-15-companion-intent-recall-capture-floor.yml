name: Team Up v0.2.0-alpha.6.6.15 Companion Intent Recall Capture Floor

on:
  push:
    branches: [ v0.2-alpha6-6-15-companion-intent-recall-capture-floor ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.15 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6615.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          a663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          a15 = (root/'ModEntry.Alpha6615.cs').read_text(encoding='utf-8')
          patch = (root/'Core/PelipperCaptureDamagePatch.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.15</Version>' in project
          assert '<EnableHarmony>true</EnableHarmony>' in project
          assert 'build: v0.2.0-alpha.6.6.15' in mod
          assert 'Companion Intent + Recall + Capture Floor loaded.' in mod

          for token in ['RegisterAlpha6615Events();','SetOwnerOptOut(owner, !includeCompanion)','requestActive = !optedOut']:
              assert token in a663, token
          for token in ['ShowLinkedCompanionControlAlpha6615','ShowCompanionReplacementForTargetAlpha6615','DetectPlayerCompanionRecallAttemptsAlpha6615','TryReadPelipperSourceDeploymentAlpha6615','ActivateCompanionAlpha6615','PutCompanionOnStandbyAlpha6615']:
              assert token in a15, token
          for token in ['Harmony','Monster.takeDamage','BeforeTakeDamage','PelipperCaptureSafetyService.ClampDamage']:
              assert token in patch, token

          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.15 source acceptance PASS')
          print('NPC-only durable intent PASS')
          print('Linked companion Call/Return/Replace PASS')
          print('Player Standby recall detection PASS')
          print('Global Pelipper capture floor patch PASS')
          print('Water/bridge performance regression guard PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.15' BUILD_LOG.txt
          grep -q 'NPC COMPANION INTENT LOCK: ENABLED' BUILD_LOG.txt
          grep -q 'COMPANION CALL / RETURN / REPLACE: ENABLED' BUILD_LOG.txt
          grep -q 'PLAYER STANDBY RECALL DETECTION: ENABLED' BUILD_LOG.txt
          grep -q 'GLOBAL PELIPPER CAPTURE DAMAGE FLOOR: ENABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.15 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6615.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_VI.txt .github/workflows/team-up-alpha6-6-15-companion-intent-recall-capture-floor.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.15 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-15-companion-intent-recall-capture-floor
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-15-companion-intent-recall-capture-floor
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_15_COMPANION_INTENT_RECALL_CAPTURE_FLOOR_VI.txt
          if-no-files-found: error
