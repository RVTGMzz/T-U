name: Team Up v0.2.0-alpha.6.7.0 Party Banter

on:
  push:
    branches:
      - v0.2-alpha6-7-0-party-banter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build and audit Alpha 6.7.0
        shell: pwsh
        run: ./BuildV0_2Alpha670.ps1
      - name: Upload Alpha 6.7.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-0-party-banter
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.0_PARTY_BANTER_MIMI_SHIPPER_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.0_PARTY_BANTER_MIMI_SHIPPER_TEST.sha256.txt
            BUILD_LOG_ALPHA670.txt
            SMOKE_TEST_V0_2_ALPHA6_7_0_PARTY_BANTER_VI.txt
          if-no-files-found: error
