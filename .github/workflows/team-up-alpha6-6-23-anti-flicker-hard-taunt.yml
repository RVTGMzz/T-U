name: Team Up v0.2.0-alpha.6.6.23 Anti-Flicker Hard Taunt

on:
  push:
    branches: [ v0.2-alpha6-6-23-anti-flicker-hard-taunt ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.23 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6623.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          a18 = (root/'ModEntry.Alpha6618.cs').read_text(encoding='utf-8')
          a21 = (root/'ModEntry.Alpha6621.cs').read_text(encoding='utf-8')
          threat = (root/'Combat/ThreatService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          codex = (root/'UI/CodexBrowserMenu.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.23</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.23' in mod
          assert 'Anti-Flicker + Hard Taunt Hotfix loaded.' in mod

          assert 'PelipperNonConvergedSourceRequestsAlpha6623' in a21
          assert 'suppress repeated lifecycle retries to prevent flicker' in a21
          assert 'teamup_pelipper_probe' in a21

          assert 'ForcedAggroState' in threat
          assert 'ForceAggro(' in threat
          assert 'IsForcedAggro(' in threat
          assert 'forced.Ticks--' in threat

          assert 'hardTauntOwnsPressure' in combat
          assert 'hardTauntTicks' in combat
          assert '_threat.ForceAggro(' in combat
          assert 'HARD TAUNT' in combat
          assert 'guardRatio = hardTauntOwnsPressure ? 1f' in combat
          assert 'CombatPathRetryCooldownTicks = 24' in combat
          assert 'CombatMovementPulseTicks = 3' in combat

          assert 'GetEffectiveCombatCompanionCountAlpha6618' in a18
          assert 'PrepareNpcCompanionRecruitCapacityAlpha6618' in a18
          assert 'Math.Min(1739, Game1.uiViewport.Width - 12)' in codex
          assert 'Math.Min(1518, Game1.uiViewport.Width - 16)' in profile
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.23 source acceptance PASS')
          print('Pelipper NPC-only anti-flicker latch PASS')
          print('Source-live 2/2 truth preserved PASS')
          print('Hard Taunt forced aggro window PASS')
          print('Hard Taunt Farmer damage redirect PASS')
          print('Hard Taunt double-hit guard PASS')
          print('Codex 115% regression guard PASS')
          print('Combat movement/path constants preserved PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.23_ANTI_FLICKER_HARD_TAUNT_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.23_ANTI_FLICKER_HARD_TAUNT_TEST.sha256.txt
          grep -q 'PELIPPER NPC-ONLY RETRY LATCH: ENABLED' BUILD_LOG.txt
          grep -q 'PELIPPER SOURCE-LIVE SLOT TRUTH: PRESERVED' BUILD_LOG.txt
          grep -q 'HARD TAUNT FORCED AGGRO WINDOW: ENABLED' BUILD_LOG.txt
          grep -q 'HARD TAUNT 100% FARMER DAMAGE REDIRECT: ENABLED' BUILD_LOG.txt
          grep -q 'HARD TAUNT DOUBLE-HIT GUARD: ENABLED' BUILD_LOG.txt
          grep -q 'CODEX 115% UI: PRESERVED' BUILD_LOG.txt
          grep -q 'SOURCE-LIVE 2/2 HARD CAP: PRESERVED' BUILD_LOG.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.23' BUILD_LOG.txt
          echo 'Alpha 6.6.23 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6623.ps1 SMOKE_TEST_V0_2_ALPHA6_6_23_ANTI_FLICKER_HARD_TAUNT_VI.txt .github/workflows/team-up-alpha6-6-23-anti-flicker-hard-taunt.yml
          if git diff --cached --quiet; then
            echo 'No materialized source diff.'
          else
            git commit -m 'chore: materialize Team Up v0.2.0-alpha.6.6.23 source [skip ci]'
            git push origin HEAD:v0.2-alpha6-6-23-anti-flicker-hard-taunt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-23-anti-flicker-hard-taunt
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.23_ANTI_FLICKER_HARD_TAUNT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.23_ANTI_FLICKER_HARD_TAUNT_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_23_ANTI_FLICKER_HARD_TAUNT_VI.txt
          if-no-files-found: error
