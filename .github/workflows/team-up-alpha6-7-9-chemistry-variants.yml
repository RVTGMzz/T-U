name: Team Up v0.2.0-alpha.6.7.9 Chemistry Variants

on:
  push:
    branches:
      - v0.2-alpha6-7-9-chemistry-variants
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x

      - name: Materialize Alpha 6.7.9 source
        run: |
          python3 tools/fix_alpha679_anchor.py
          python3 tools/materialize_alpha679.py

      - name: Build, audit and package Alpha 6.7.9
        run: python3 tools/build_alpha679.py

      - name: Materialize verified source back to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.9 source [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-9-chemistry-variants
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.9_CHEMISTRY_VARIANTS_AUDIT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.9_CHEMISTRY_VARIANTS_AUDIT_TEST.sha256.txt
            BUILD_LOG_ALPHA679.txt
            CHEMISTRY_VARIANTS_AUDIT_ALPHA679.md
            SMOKE_TEST_V0_2_ALPHA6_7_9_CHEMISTRY_VARIANTS_VI.txt
          if-no-files-found: error
