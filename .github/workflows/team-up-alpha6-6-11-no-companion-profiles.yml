name: Team Up v0.2.0-alpha.6.6.11 No Companion Profiles

on:
  push:
    branches: [ v0.2-alpha6-6-11-no-companion-profiles ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.11 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6611.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          deployment = (root/'Core/PelipperDeploymentStateService.cs').read_text(encoding='utf-8')
          alpha669 = (root/'ModEntry.Alpha669.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          tile = (root/'Core/PartyTileSafety.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.11</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.11' in mod
          assert 'No Companion Profiles Hotfix loaded.' in mod

          for token in [
              'private bool CanOpenDirectProfile(NPC npc)',
              'Party.CompanionUnits.Any',
              'TeamUpCharacterKind.FarmerOrSpecialCompanion',
              'TeamUpCharacterKind.NpcLinkedCompanion',
              'npc.Name.StartsWith("PelipperTown."',
              '!npc.IsVillager && profile is null',
              'CanOpenDirectProfile(speaker)',
              'CanOpenDirectProfile(npc)'
          ]:
              assert token in mod, token

          profile_start = mod.index('            if (Config.ProfileKey.JustPressed())')
          profile_end = mod.index('            if (Config.RecruitKey.JustPressed())', profile_start)
          assert 'CanOpenDirectProfile(speaker)' in mod[profile_start:profile_end]

          draw_start = mod.index('    private void DrawDialogueActions(')
          draw_end = mod.index('        long recruiterId = Game1.player.UniqueMultiplayerID;', draw_start)
          assert 'CanOpenDirectProfile(speaker)' in mod[draw_start:draw_end]

          open_start = mod.index('    private void OpenProfileFromDialogue(NPC npc)')
          open_end = mod.index('        IClickableMenu? dialogueMenu', open_start)
          assert 'CanOpenDirectProfile(npc)' in mod[open_start:open_end]

          # 6.6.10 source movement authority remains intact.
          start = follow.index('    private void UpdateCompanionUnits(')
          end = follow.index('    private void FollowTarget(', start)
          body = follow[start:end]
          assert body.index('PelipperTownCompatibilityService.IsSourceControlled(unit)') < body.index('ResolveCharacter(unit.CharacterName)')

          assert 'desiredState = deployed ? ActiveValue : StandbyValue' in deployment
          assert 'currentState.Equals(desiredState' in deployment
          assert 'currentOwner.Equals(ownerName' in deployment

          for token in ['RenderedWorld', 'RenderedHud', 'BuildHealthSnapshotSignatureAlpha669']:
              assert token in alpha669, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat
          for token in ['CombatPathRetryCooldownTicks = 24', 'CombatMovementPulseTicks = 3', 'PartyTileSafety.IsWalkableLandOrBridge(location, tile)']:
              assert token in combat, token
          for token in ['isWaterTile(x, y)', 'GetLayer("Buildings")', 'isTilePassable(tile)']:
              assert token in tile, token

          print('Alpha 6.6.11 source acceptance PASS')
          print('Companion/summon direct profile block PASS')
          print('Dialogue profile hint/input/final-open guards PASS')
          print('6.6.10 follow authority regression PASS')
          print('6.6.7 performance + 6.6.8 land-safe + 6.6.9 health regression PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.11_NO_COMPANION_PROFILES_HOTFIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.11_NO_COMPANION_PROFILES_HOTFIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.11' BUILD_LOG.txt
          grep -q 'COMPANION / SUMMON DIRECT PROFILES: BLOCKED' BUILD_LOG.txt
          grep -q 'DIALOGUE PROFILE HINT FOR COMPANIONS: HIDDEN' BUILD_LOG.txt
          echo 'Alpha 6.6.11 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6611.ps1 SMOKE_TEST_V0_2_ALPHA6_6_11_NO_COMPANION_PROFILES_VI.txt .github/workflows/team-up-alpha6-6-11-no-companion-profiles.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.11 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-11-no-companion-profiles
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-11-no-companion-profiles
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.11_NO_COMPANION_PROFILES_HOTFIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.11_NO_COMPANION_PROFILES_HOTFIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_11_NO_COMPANION_PROFILES_VI.txt
          if-no-files-found: error
