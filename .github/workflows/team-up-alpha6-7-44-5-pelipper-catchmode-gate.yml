name: Team Up v0.2.0-alpha.6.7.44.5 Pelipper Catch Mode Gate

on:
  push:
    branches:
      - v0.2-alpha6-7-44-5-pelipper-catchmode-gate
    paths:
      - 'src/TeamUp/Core/PelipperCaptureSafetyService.cs'
      - 'src/TeamUp/Core/PelipperWildEncounterIdentityService.cs'
      - 'src/TeamUp/Core/EncounterReactionService.cs'
      - 'src/TeamUp/Combat/MonsterMutationService.cs'
      - 'src/TeamUp/ModEntry.Alpha67442.cs'
      - 'src/TeamUp/TeamUp.csproj'
      - 'src/TeamUp/manifest.json'
      - 'src/TeamUp/assets/**'
      - 'src/TeamUp/i18n/**'
      - 'tools/build_alpha6744_5.py'
      - '.github/workflows/team-up-alpha6-7-44-5-pelipper-catchmode-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build, audit and package Alpha 6.7.44.5
        run: python3 tools/build_alpha6744_5.py
      - name: Upload Alpha 6.7.44.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-5-pelipper-catchmode-gate
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44.5_PELIPPER_CATCHMODE_GATE_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44.5_PELIPPER_CATCHMODE_GATE_TEST.sha256.txt
            BUILD_LOG_ALPHA6744_5.txt
            PELIPPER_CATCHMODE_GATE_AUDIT_ALPHA6744_5.md
          if-no-files-found: error
