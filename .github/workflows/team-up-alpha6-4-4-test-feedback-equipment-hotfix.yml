name: Team Up v0.2.0-alpha.6.4.4 Test Feedback Equipment Hotfix

on:
  push:
    branches: [ v0.2-alpha6-4-4-test-feedback-equipment-hotfix ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.4.4 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha644.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.4.4'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          alpha6 = (root/'Combat/Alpha6CombatPolishService.cs').read_text(encoding='utf-8')
          debug = (root/'Debugging/TeamUpDebugService.cs').read_text(encoding='utf-8')
          sandbox = (root/'Debugging/CardchaCombatSandboxService.cs').read_text(encoding='utf-8')
          compat = (root/'Core/OptionalTestHostCompatibility.cs').read_text(encoding='utf-8')
          relationship = (root/'Core/RelationshipBondService.cs').read_text(encoding='utf-8')
          renderer = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          i18n_en = (root/'i18n/default.json').read_text(encoding='utf-8')
          i18n_vi = (root/'i18n/vi.json').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert mod.count(f'Team Up DEBUG HARNESS READY | command: teamup_test | build: v{version}') == 1
          assert 'test feedback + equipment hotfix loaded' in mod

          # Equipment live-test fixes.
          assert 'EquipmentSlot? naturalSlot = GetNaturalSlot(item)' in equipment
          assert 'private static EquipmentSlot? GetNaturalSlot' in equipment
          assert 'EquipmentSlot? lastChangedSlot = null' in equipment
          assert '_selectedSlot = lastChangedSlot.Value' in equipment
          assert 'foreach (EquipmentSlot fallback' in equipment
          assert 'equipment.controls-short' in equipment
          assert 'cardY = Math.Max' in equipment
          assert 'bool compatible = GetNaturalSlot(item).HasValue' in equipment
          assert 'EquipmentPreviewService.BuildPreview(previewSlot' in equipment
          assert '"equipment.controls-short"' in i18n_en
          assert '"equipment.controls-short"' in i18n_vi

          # Profile overflow and pending-kit readability.
          assert 'DescriptionScale = BodyScale * 2f' in profile
          assert 'IsPendingCombatKit()' in profile
          assert 'pendingKit ? BodyScale : DescriptionScale' in profile
          assert 'DrawSectionTitleIfVisible(b, _i18n.Get("profile.relationship")' in profile
          assert 'WrapScaled(_relationshipText, panelWidth' not in profile
          assert 'TraitIconKind.Passive' not in profile
          assert 'TraitIconKind.Signature' in profile

          # Healing responsiveness/feedback.
          assert '0.82f : 0.60f' in combat
          assert 'HEAL +{restored}' in combat
          assert 'role == PartyRole.Healer ? 210 : 315' in combat
          assert 'farmerRatio < 0.72f' in alpha6
          assert 'farmerRatio < 0.62f' in alpha6

          # Keep Alpha 6.4.3 sandbox and previous architecture locks.
          assert 'Cardcha_CardTestArena' in sandbox
          assert 'CardTestArenaDummy' in compat
          assert 'CardTestArenaKillTarget' in compat
          assert 'region1-hunting' not in debug
          for token in ['TrustedHearts = 4', 'CloseCompanionHearts = 8', 'MaxFriendshipHearts = 10', 'SoulmateHearts = 14']:
              assert token in relationship, token
          for name in ['Abigail','Alex','Harvey','Maru','Emily','Caroline','Wizard','Alesia','Ysabelle']:
              assert f'["{name}"] = P(' in renderer, name

          print('Alpha 6.4.4 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.4.4_TEST_FEEDBACK_EQUIPMENT_HOTFIX.zip
          test -s release/TeamUp_v0.2.0-alpha.6.4.4_TEST_FEEDBACK_EQUIPMENT_HOTFIX.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.4.4' BUILD_LOG.txt
          echo 'Alpha 6.4.4 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support/IntegrateAlpha644TestFeedbackEquipmentHotfix.ps1 BuildV0_2Alpha644.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_4_4_HOTFIX_VI.txt .github/workflows/team-up-alpha6-4-4-test-feedback-equipment-hotfix.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.4.4 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-4-4-test-feedback-equipment-hotfix
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-4-4-test-feedback-equipment-hotfix
          path: |
            release/TeamUp_v0.2.0-alpha.6.4.4_TEST_FEEDBACK_EQUIPMENT_HOTFIX.zip
            release/TeamUp_v0.2.0-alpha.6.4.4_TEST_FEEDBACK_EQUIPMENT_HOTFIX.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_4_4_HOTFIX_VI.txt
          if-no-files-found: error
