name: Team Up v0.2.0-alpha.6.7.44 Lower Workings Interior Survey

on:
  push:
    branches:
      - v0.2-alpha6-7-44-lower-workings-interior-survey
    paths:
      - 'tools/materialize_alpha6744.py'
      - 'tools/materialize_alpha6744_fixups.py'
      - 'tools/build_alpha6744.py'
      - '.github/workflows/team-up-alpha6-7-44-lower-workings-interior-survey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Materialize Alpha 6.7.44 dedicated Lower Workings source
        run: |
          python3 tools/materialize_alpha6744.py
          python3 tools/materialize_alpha6744_fixups.py
      - name: Build, audit and package Alpha 6.7.44
        run: python3 tools/build_alpha6744.py
      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.44 Lower Workings interior survey [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload Alpha 6.7.44 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-lower-workings-interior-survey
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44_LOWER_WORKINGS_INTERIOR_SURVEY_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44_LOWER_WORKINGS_INTERIOR_SURVEY_TEST.sha256.txt
            BUILD_LOG_ALPHA6744.txt
            LOWER_WORKINGS_INTERIOR_SURVEY_AUDIT_ALPHA6744.md
            SMOKE_TEST_V0_2_ALPHA6_7_44_LOWER_WORKINGS_INTERIOR_SURVEY_VI.txt
          if-no-files-found: error
