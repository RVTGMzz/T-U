name: Team Up v0.2.0-alpha.6.4.1 Friendship Bond

on:
  push:
    branches: [ v0.2-alpha6-4-1-friendship-bond ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.4.1 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha641.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.4.1'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          relationship = (root/'Core/RelationshipBondService.cs').read_text(encoding='utf-8')
          progression = (root/'Core/ProgressionService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          identity = (root/'Combat/CharacterSkillIdentityService.cs').read_text(encoding='utf-8')
          expansion = (root/'Combat/ExpansionSkillService.cs').read_text(encoding='utf-8')
          alpha6 = (root/'Combat/Alpha6CombatPolishService.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          renderer = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          party_data = (root/'Core/PartyMemberData.cs').read_text(encoding='utf-8')
          en = (root/'i18n/default.json').read_text(encoding='utf-8')
          vi = (root/'i18n/vi.json').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert mod.count(f'Team Up DEBUG HARNESS READY | command: teamup_test | build: v{version}') == 1
          assert 'friendship & bond loaded' in mod
          assert 'RelationshipBondService Relationships' in mod
          assert 'Relationships.Update(Party.Members' in mod

          # Agreed relationship milestones.
          for token in ['TrustedHearts = 4', 'CloseCompanionHearts = 8', 'MaxFriendshipHearts = 10', 'SoulmateHearts = 14']:
              assert token in relationship, token
          assert '0.10d' in relationship
          assert 'GetRetreatThresholdAdjustment' in relationship
          assert 'GetRecoveryThresholdAdjustment' in relationship
          assert 'return GetHearts(member.CharacterName) >= MaxFriendshipHearts ? 1.05f : 1f;' in relationship

          # Vanilla spouse identities + expansion fallback.
          vanilla_traits = [
              'Abigail','Alex','Elliott','Emily','Haley','Harvey','Leah','Maru','Penny','Sam','Sebastian','Shane'
          ]
          for name in vanilla_traits:
              assert f'["{name}"] = new(' in relationship, name
          assert 'BuildRoleFallback' in relationship
          assert 'EmergencyHealCooldownTicks = 1800' in relationship

          # Runtime-only, bounded relationship effects.
          assert 'ConfigureRelationshipHooks' in progression
          assert 'GetSignatureEffectMultiplier' in progression
          assert 'GetRecoveryThresholdAdjustment' in progression
          assert 'Math.Clamp(value, 1f, 1.10f)' in progression
          assert 'Math.Clamp(GetActiveModifiers(member).Sum(modifier => modifier.DamageBonusPercent), 0f, 0.25f)' in progression
          assert 'RelationshipBond' not in party_data
          assert 'Soulmate' not in party_data

          # 8-heart timing and 10-heart signature affinity reach all signature layers.
          assert 'GetRecoveryThresholdAdjustment(member, role)' in combat
          assert 'GetSignatureEffectMultiplier(member, role)' in combat
          assert 'GetSignatureEffectMultiplier(member, role)' in identity
          assert 'GetSignatureEffectMultiplier(member, role)' in expansion
          assert 'GetSignatureEffectMultiplier(member, role)' in alpha6

          # Profile/UI and i18n.
          assert 'profile.relationship' in profile
          assert 'RelationshipBondState bond' in mod
          assert 'relationship.stage.soulmate' in en
          assert 'relationship.stage.soulmate' in vi

          # Previous locks remain.
          assert 'AutoEquipBest()' in equipment
          assert 'DrawRarityFrame' in equipment
          assert 'TraitIconKind.Passive' not in profile
          for name in ['Abigail','Alex','Harvey','Maru','Emily','Caroline','Wizard','Alesia','Ysabelle']:
              assert f'["{name}"] = P(' in renderer, name

          print('Alpha 6.4.1 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.4.1_FRIENDSHIP_BOND_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.4.1_FRIENDSHIP_BOND_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.4.1' BUILD_LOG.txt
          echo 'Alpha 6.4.1 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support/IntegrateAlpha641FriendshipBond.ps1 BuildV0_2Alpha641.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_4_1_FRIENDSHIP_BOND_VI.txt .github/workflows/team-up-alpha6-4-1-friendship-bond.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.4.1 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-4-1-friendship-bond
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-4-1-friendship-bond
          path: |
            release/TeamUp_v0.2.0-alpha.6.4.1_FRIENDSHIP_BOND_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.4.1_FRIENDSHIP_BOND_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_4_1_FRIENDSHIP_BOND_VI.txt
          if-no-files-found: error
