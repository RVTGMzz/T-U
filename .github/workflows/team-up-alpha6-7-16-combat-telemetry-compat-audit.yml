name: Team Up v0.2.0-alpha.6.7.16 Combat Telemetry + Compat Audit

on:
  push:
    branches:
      - v0.2-alpha6-7-16-combat-telemetry-compat-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x

      - name: Build, audit and package Alpha 6.7.16
        run: python3 tools/build_alpha6716.py

      - name: Upload Alpha 6.7.16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-16-combat-telemetry-compat-audit
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.16_COMBAT_TELEMETRY_COMPAT_AUDIT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.16_COMBAT_TELEMETRY_COMPAT_AUDIT_TEST.sha256.txt
            BUILD_LOG_ALPHA6716.txt
            TELEMETRY_COMPAT_AUDIT_ALPHA6716.md
            SMOKE_TEST_V0_2_ALPHA6_7_16_TELEMETRY_COMPAT_VI.txt
          if-no-files-found: error
