name: Team Up v0.2.0-alpha.6.3.1 Equipment RPG Polish

on:
  push:
    branches: [ v0.2-alpha6-3-1-equipment-rpg-polish ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.3.1 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha631.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.3.1'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          rpg = (root/'Core/EquipmentRpgPolishService.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          en = json.loads((root/'i18n/default.json').read_text(encoding='utf-8-sig'))
          vi = json.loads((root/'i18n/vi.json').read_text(encoding='utf-8-sig'))

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert 'AutoEquipBest()' in equipment
          assert 'DrawRarityFrame' in equipment
          assert 'EquipmentImpactPreview' in equipment
          assert 'EquipmentRpgPolishService.GetRarity' in equipment
          assert 'ScoreItem' in rpg and 'BuildImpact' in rpg
          assert 'SignatureCooldownTicks' in rpg
          assert 'TraitIconRenderer.TraitIconKind.Passive' in profile
          assert 'TraitIconRenderer.TraitIconKind.Signature' in profile
          for key in ['equipment.auto-equip','equipment.role-score','equipment.skill-impact','equipment.rarity.legendary']:
              assert en.get(key), key
              assert vi.get(key), key
          print('Alpha 6.3.1 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.3.1_EQUIPMENT_RPG_POLISH_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.3.1_EQUIPMENT_RPG_POLISH_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.3.1' BUILD_LOG.txt
          echo 'Alpha 6.3.1 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support/IntegrateAlpha631EquipmentRpgPolish.ps1 BuildV0_2Alpha631.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_3_1_EQUIPMENT_RPG_VI.txt .github/workflows/team-up-alpha6-3-1-equipment-rpg-polish.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.3.1 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-3-1-equipment-rpg-polish
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-3-1-equipment-rpg-polish
          path: |
            release/TeamUp_v0.2.0-alpha.6.3.1_EQUIPMENT_RPG_POLISH_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.3.1_EQUIPMENT_RPG_POLISH_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_3_1_EQUIPMENT_RPG_VI.txt
          if-no-files-found: error
