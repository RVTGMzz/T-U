name: Team Up v0.2.0-alpha.6.6.18 NPC Companion Source Truth Hard Preflight

on:
  push:
    branches: [ v0.2-alpha6-6-18-npc-companion-source-truth-hard-preflight ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.18 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6618Final.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          a661 = (root/'ModEntry.Alpha661.cs').read_text(encoding='utf-8')
          a663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          a15 = (root/'ModEntry.Alpha6615.cs').read_text(encoding='utf-8')
          a16 = (root/'ModEntry.Alpha6616.cs').read_text(encoding='utf-8')
          a17 = (root/'ModEntry.Alpha6617.cs').read_text(encoding='utf-8')
          a18 = (root/'ModEntry.Alpha6618.cs').read_text(encoding='utf-8')
          bridge = (root/'Core/PelipperVillagerCompanionRuntimeBridge.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.18</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.18' in mod
          assert 'NPC Companion Source Truth + Hard Preflight Hotfix loaded.' in mod
          assert 'EnsureAlpha6618EventsRegistered();' in a16

          for token in [
              'ReconcilePelipperNpcSlotTruthAlpha6618',
              'GetEffectiveCombatCompanionCountAlpha6618',
              'GetEffectiveReplaceableCompanionsAlpha6618',
              'PrepareNpcCompanionRecruitCapacityAlpha6618',
              'TrySetPelipperNpcSourceEnabledAlpha6618',
              'source-live partner continues to consume a real slot']:
              assert token in a18, token

          for token in ['TrySetEnabled','TrySetConfigState','TryInvokeSourceAction','RestoreAll','CompanionEnabled','PartnerEnabled']:
              assert token in bridge, token

          assert 'explicit Return/Standby' in a15
          assert 'RestorePelipperNpcSourceAlpha6618(owner);' in a663
          assert 'PrepareNpcCompanionRecruitCapacityAlpha6618' in a661
          assert 'HasFreeEffectiveCompanionSlotAlpha6618' in a661
          assert 'GetEffectiveReplaceableCompanionsAlpha6618' in a661
          assert 'ReconcilePelipperPlayerSlotTruthAlpha6617' in a17

          forbidden = ['TrySetActorInvisibleAlpha6613(', 'PelipperTownCompatibilityService.SetSuppressed(', '.Halt();', '.controller =', '.temporaryController =']
          for token in forbidden:
              assert token not in bridge, token
              assert token not in a18, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.18 source acceptance PASS')
          print('NPC-linked Pelipper source-native recall/deploy bridge PASS')
          print('NPC source-live effective slot accounting PASS')
          print('NPC+Pokemon authoritative 2/2 preflight PASS')
          print('Full pool requires real replacement or reject PASS')
          print('No render/movement suppression fallback PASS')
          print('6.6.17 player ghost-slot regression PASS')
          print('Water/bridge performance regression guard PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.18' BUILD_LOG.txt
          grep -q 'PELIPPER NPC SOURCE-NATIVE RECALL/DEPLOY BRIDGE: ENABLED' BUILD_LOG.txt
          grep -q 'NPC SOURCE-LIVE EFFECTIVE SLOT ACCOUNTING: ENABLED' BUILD_LOG.txt
          grep -q 'NPC+POKEMON AUTHORITATIVE 2/2 PREFLIGHT: ENABLED' BUILD_LOG.txt
          grep -q 'FULL POOL REQUIRES REAL REPLACEMENT OR REJECT: ENABLED' BUILD_LOG.txt
          grep -q 'RENDER-ONLY INVISIBILITY FALLBACK: DISABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.18 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6618.ps1 BuildV0_2Alpha6618Final.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_VI.txt .github/workflows/team-up-alpha6-6-18-npc-companion-source-truth-hard-preflight.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.18 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-18-npc-companion-source-truth-hard-preflight
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-18-npc-companion-source-truth-hard-preflight
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_18_NPC_COMPANION_SOURCE_TRUTH_HARD_PREFLIGHT_VI.txt
          if-no-files-found: error
