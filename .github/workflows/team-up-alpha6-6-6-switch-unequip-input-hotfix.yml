name: Team Up v0.2.0-alpha.6.6.6 Switch Unequip Input Hotfix

on:
  push:
    branches: [ v0.2-alpha6-6-6-switch-unequip-input-hotfix ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.6 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha666.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.6.6'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          alpha663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          codex = (root/'UI/CodexBrowserMenu.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          progression = (root/'Core/ProgressionService.cs').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod

          for token in [
              'e.Button.IsActionButton()',
              'e.Button.IsUseToolButton()',
              'routedButton = Buttons.A',
              'routedButton = Buttons.X',
              'Helper.Input.Suppress(e.Button)',
              'menu.receiveGamePadButton(routedButton.Value)'
          ]:
              assert token in alpha663, token

          for token in [
              'DoubleClickWindowMs = 450',
              'ControllerActivationDebounceMs = 180',
              'ControllerMouseEchoSuppressionMs = 260',
              'TryBeginControllerActivation()',
              'UnequipSelected();',
              'bool committed = committedData is not null',
              'GetActualEquippedItem(_selectedSlot) is null'
          ]:
              assert token in equipment, token

          assert 'IsDoubleClick(2000 + i)' not in equipment
          assert 'IsDoubleClick(1000 + i)' in equipment
          assert 'MoveVertical(-2)' not in codex
          assert 'MoveVertical(2)' not in codex
          assert 'ProfileContentScale = 1.52f' in profile
          assert 'DescriptionScale = BodyScale * 2f' not in profile
          assert ' · ' not in progression
          assert '—' not in progression

          print('Alpha 6.6.6 source acceptance PASS')
          print('Switch semantic Action equip PASS')
          print('Switch semantic Use Tool unequip PASS')
          print('Transactional equipment regression PASS')
          print('Alpha 6.6.5 Codex/Profile/font regression PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.6_SWITCH_UNEQUIP_INPUT_HOTFIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.6_SWITCH_UNEQUIP_INPUT_HOTFIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.6' BUILD_LOG.txt
          grep -q 'SWITCH SEMANTIC ACTION EQUIP: ENABLED' BUILD_LOG.txt
          grep -q 'SWITCH SEMANTIC USE-TOOL UNEQUIP: ENABLED' BUILD_LOG.txt
          grep -q 'TRANSACTIONAL EQUIPMENT SAFETY: PRESERVED' BUILD_LOG.txt
          echo 'Alpha 6.6.6 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha666.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_6_SWITCH_UNEQUIP_INPUT_HOTFIX_VI.txt .github/workflows/team-up-alpha6-6-6-switch-unequip-input-hotfix.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.6 Switch unequip hotfix source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-6-switch-unequip-input-hotfix
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-6-switch-unequip-input-hotfix
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.6_SWITCH_UNEQUIP_INPUT_HOTFIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.6_SWITCH_UNEQUIP_INPUT_HOTFIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_6_SWITCH_UNEQUIP_INPUT_HOTFIX_VI.txt
          if-no-files-found: error
