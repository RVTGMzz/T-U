name: Team Up v0.2.0-alpha.6.6.16 Controller Companion Slot Runtime Fix

on:
  push:
    branches: [ v0.2-alpha6-6-16-controller-companion-slot-runtime-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.16 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6616.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          a663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          a15 = (root/'ModEntry.Alpha6615.cs').read_text(encoding='utf-8')
          a16 = (root/'ModEntry.Alpha6616.cs').read_text(encoding='utf-8')
          compat = (root/'Core/PelipperTownCompatibilityService.cs').read_text(encoding='utf-8')
          capture = (root/'Core/PelipperCaptureSafetyService.cs').read_text(encoding='utf-8')
          patch = (root/'Core/PelipperCaptureDamagePatch.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.16</Version>' in project
          assert '<EnableHarmony>true</EnableHarmony>' in project
          assert 'build: v0.2.0-alpha.6.6.16' in mod
          assert 'Controller Companion Slot Runtime Fix loaded.' in mod
          assert 'HandleDialogueCompanionInputAlpha6616(e, speaker)' in mod
          assert 'UpdateDialogueCompanionInputAlpha6616();' in mod

          for token in ['P / L+R Pokémon','IsOwnerOptedOut(owner)','ShowLinkedCompanionControlAlpha6615']:
              assert token in a15, token
          for token in ['requestActive: false','SetOwnerOptOut(owner, !includeCompanion)']:
              assert token in a663, token
          for token in ['DialogueShoulderChordWindowMsAlpha6616','Buttons.LeftShoulder','Buttons.RightShoulder','OpenLinkedCompanionControlAlpha6616','ShowLeaveQuestion']:
              assert token in a16, token
          for token in ['Source-hidden partners','IsWildCombatActor']:
              assert token in compat, token
          assert 'IsWildCombatActor(monster)' in capture
          assert 'FallbackThreshold = 0.10f' in capture
          for token in ['Harmony','Monster.takeDamage','BeforeTakeDamage','PelipperCaptureSafetyService.ClampDamage']:
              assert token in patch, token

          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.16 source acceptance PASS')
          print('P / L+R companion routing precedence PASS')
          print('L+R cannot fall through to Leave PASS')
          print('NPC-only immediate Standby registration PASS')
          print('Source-hidden explicit-owner partner discovery PASS')
          print('Pelipper wild capture identity floor PASS')
          print('Water/bridge performance regression guard PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.16' BUILD_LOG.txt
          grep -q 'P / L+R NPC POKEMON ROUTING: ENABLED' BUILD_LOG.txt
          grep -q 'L+R CANNOT FALL THROUGH TO NPC LEAVE: ENABLED' BUILD_LOG.txt
          grep -q 'NPC-ONLY STANDBY RECALL PATH: ENABLED' BUILD_LOG.txt
          grep -q 'PELIPPER WILD CAPTURE IDENTITY FLOOR: ENABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.16 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6616.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_VI.txt .github/workflows/team-up-alpha6-6-16-controller-companion-slot-runtime-fix.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.16 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-16-controller-companion-slot-runtime-fix
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-16-controller-companion-slot-runtime-fix
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_16_CONTROLLER_COMPANION_SLOT_RUNTIME_FIX_VI.txt
          if-no-files-found: error
