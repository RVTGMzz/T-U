name: Team Up v0.2.0-alpha.6.7.32 Field Triangulation

on:
  push:
    branches:
      - v0.2-alpha6-7-32-field-triangulation
    paths:
      - 'src/TeamUp/**'
      - 'tools/materialize_alpha6732.py'
      - 'tools/build_alpha6732.py'
      - '.github/workflows/team-up-alpha6-7-32-field-triangulation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: '6.0.x'

      - name: Materialize Alpha 6.7.32 field triangulation source
        run: python3 tools/materialize_alpha6732.py

      - name: Build, audit and package Alpha 6.7.32
        run: python3 tools/build_alpha6732.py

      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.32 field triangulation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-32-field-triangulation
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.32_FIELD_TRIANGULATION_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.32_FIELD_TRIANGULATION_TEST.sha256.txt
            BUILD_LOG_ALPHA6732.txt
            FIELD_TRIANGULATION_AUDIT_ALPHA6732.md
            SMOKE_TEST_V0_2_ALPHA6_7_32_FIELD_TRIANGULATION_VI.txt
          if-no-files-found: error
