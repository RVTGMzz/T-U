name: Team Up v0.2.0-alpha.6.7.44.10 Pelipper Species Pairing Probe

on:
  push:
    branches:
      - v0.2-alpha6-7-44-10-pelipper-species-pairing-probe
    paths:
      - 'src/TeamUp/Core/Alpha674410PelipperSpeciesPairingService.cs'
      - 'src/TeamUp/Core/Alpha67449PelipperSourceProbeService.cs'
      - 'src/TeamUp/Core/Alpha67448PelipperSourceMutationService.cs'
      - 'src/TeamUp/Core/PelipperWildEncounterIdentityService.cs'
      - 'src/TeamUp/Combat/MonsterMutationService.cs'
      - 'src/TeamUp/ModEntry.Alpha6719.cs'
      - 'src/TeamUp/ModEntry.Alpha67446.cs'
      - 'src/TeamUp/TeamUp.csproj'
      - 'src/TeamUp/manifest.json'
      - 'src/TeamUp/assets/**'
      - 'src/TeamUp/i18n/**'
      - 'tools/build_alpha6744_10.py'
      - '.github/workflows/team-up-alpha6-7-44-10-pelipper-species-pairing-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build, audit and package Alpha 6.7.44.10
        run: python3 tools/build_alpha6744_10.py
      - name: Upload Alpha 6.7.44.10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-10-pelipper-species-pairing-probe
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44.10_PELIPPER_SPECIES_PAIRING_PROBE_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44.10_PELIPPER_SPECIES_PAIRING_PROBE_TEST.sha256.txt
            BUILD_LOG_ALPHA6744_10.txt
            PELIPPER_SPECIES_PAIRING_AUDIT_ALPHA6744_10.md
          if-no-files-found: error
