name: Team Up v0.2.0-alpha.6.7.44.12 Pelipper modData HP Binding

on:
  push:
    branches:
      - v0.2-alpha6-7-44-12-pelipper-moddata-hp-binding
    paths:
      - 'src/TeamUp/Core/Alpha674412PelipperModDataHpBindingService.cs'
      - 'src/TeamUp/Core/Alpha674410PelipperSpeciesPairingService.cs'
      - 'src/TeamUp/Core/Alpha67448PelipperSourceMutationService.cs'
      - 'src/TeamUp/ModEntry.Alpha6719.cs'
      - 'src/TeamUp/ModEntry.Alpha67446.cs'
      - 'src/TeamUp/TeamUp.csproj'
      - 'src/TeamUp/manifest.json'
      - 'src/TeamUp/assets/**'
      - 'src/TeamUp/i18n/**'
      - 'tools/build_alpha6744_11.py'
      - '.github/workflows/team-up-alpha6-7-44-11-pelipper-pair-cache-dual-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build, audit and package Alpha 6.7.44.12
        run: python3 tools/build_alpha6744_11.py
      - name: Upload Alpha 6.7.44.12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-12-pelipper-moddata-hp-binding
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44.12_PELIPPER_MODDATA_HP_BINDING_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44.12_PELIPPER_MODDATA_HP_BINDING_TEST.sha256.txt
            BUILD_LOG_ALPHA6744_12.txt
          if-no-files-found: error
