# One-shot cleanup of private transfer chunks. Verified release asset is preserved.
name: Team Up v0.2.0-alpha.6.7.44.24 Cleanup Export Files

on:
  push:
    branches:
      - v0.2-alpha6-7-44-24-elite-combat-finalization
    paths:
      - '.github/workflows/team-up-alpha6-7-44-11-pelipper-pair-cache-dual-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          if [ -d _ci_export_674424 ]; then
            rm -rf _ci_export_674424
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A _ci_export_674424
            git commit -m "ci-export: clean temporary 6.7.44.24 transfer files [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "CI_EXPORT_CLEAN"
