# One-shot 6.7.44.24 private export re-split. Build already passed at run 35135507500.
name: Team Up v0.2.0-alpha.6.7.44.24 Export Resplit

on:
  push:
    branches:
      - v0.2-alpha6-7-44-24-elite-combat-finalization
    paths:
      - '.github/workflows/team-up-alpha6-7-44-11-pelipper-pair-cache-dual-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resplit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Re-split existing verified package base64 into connector-sized chunks
        shell: bash
        run: |
          set -euo pipefail
          cat _ci_export_674424/part_* > /tmp/teamup_674424.b64
          EXPECTED="$(awk '{print $1}' _ci_export_674424/BASE64_SIZE.txt)"
          ACTUAL="$(wc -c < /tmp/teamup_674424.b64)"
          test "$EXPECTED" = "$ACTUAL"
          rm _ci_export_674424/part_*
          split -b 30000 -d -a 2 /tmp/teamup_674424.b64 _ci_export_674424/part_
          ls _ci_export_674424/part_* | wc -l > _ci_export_674424/PART_COUNT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ci_export_674424
          git commit -m "ci-export: resplit 6.7.44.24 package [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "CI_RESPLIT_READY"
          cat _ci_export_674424/PART_COUNT.txt
          cat _ci_export_674424/BASE64_SIZE.txt
