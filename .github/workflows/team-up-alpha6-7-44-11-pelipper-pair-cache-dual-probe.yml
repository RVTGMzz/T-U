# 6.7.44.29 Lower Workings runtime command hardening.
name: Team Up v0.2.0-alpha.6.7.44.29 Lower Runtime Command Hardening

on:
  push:
    branches:
      - v0.2-alpha6-7-44-29-lower-runtime-command-hardening
    paths:
      - 'src/TeamUp/ModEntry.cs'
      - 'src/TeamUp/ModEntry.Alpha6744.cs'
      - 'src/TeamUp/Core/Alpha674428LowerWorkingsRuntimeGateService.cs'
      - 'src/TeamUp/TeamUp.csproj'
      - 'src/TeamUp/manifest.json'
      - 'src/TeamUp/assets/LowerWorkings.tmx'
      - 'src/TeamUp/assets/**'
      - 'src/TeamUp/i18n/**'
      - 'tools/build_alpha6744_29.py'
      - '.github/workflows/team-up-alpha6-7-44-11-pelipper-pair-cache-dual-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EXPORT_TAG: team-up-6.7.44.24-ci-export
      ZIP_NAME: TeamUp_v0.2.0-alpha.6.7.44.29_LOWER_RUNTIME_COMMAND_HARDENING_TEST.zip
      SHA_NAME: TeamUp_v0.2.0-alpha.6.7.44.29_LOWER_RUNTIME_COMMAND_HARDENING_TEST.sha256.txt
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build and audit Alpha 6.7.44.29
        run: python3 tools/build_alpha6744_29.py
      - name: Upload Alpha 6.7.44.29 workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-29-lower-runtime-command-hardening
          path: |
            release/${{ env.ZIP_NAME }}
            release/${{ env.SHA_NAME }}
            BUILD_LOG_ALPHA6744_29.txt
          if-no-files-found: error
      - name: Export Alpha 6.7.44.29 through existing private prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$EXPORT_TAG" \
            "release/$ZIP_NAME" \
            "release/$SHA_NAME" \
            "BUILD_LOG_ALPHA6744_29.txt" \
            --clobber
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPORT_TAG" --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .id")"
          test -n "$ASSET_ID"
          echo "TEAMUP_674429_RELEASE_ASSET_ID=$ASSET_ID"
