# One-shot cleanup after verified 6.7.44.24 build/export.
name: Team Up v0.2.0-alpha.6.7.44.24 Finalize Test Release

on:
  push:
    branches:
      - v0.2-alpha6-7-44-24-elite-combat-finalization
    paths:
      - '.github/workflows/team-up-alpha6-7-44-11-pelipper-pair-cache-dual-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_TAG: team-up-6.7.44.24-ci-export
      NEW_TAG: v0.2.0-alpha.6.7.44.24-test
      VERIFIED_SHA: cacc69b9ccfeedfa2a9094044efa13781d33655e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified assets and clean temporary export files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/teamup-674424-release
          mkdir -p /tmp/teamup-674424-release
          gh release download "$OLD_TAG" -D /tmp/teamup-674424-release
          gh release delete "$NEW_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$NEW_TAG" /tmp/teamup-674424-release/* \
            --target "$VERIFIED_SHA" \
            --title "Team Up 6.7.44.24 Elite Combat Finalization TEST" \
            --notes "Runtime test build. Extends Mutant leader reach to 160px with a 128px hold band, preserves intended Mutation x2 contact damage with requested-vs-actual telemetry, blocks native capture for the Mutant leader only, and leaves ordinary source-native followers catchable. Build/audit PASS with 0 warnings and 0 errors. ZIP SHA256: 5f5c4817600f9aaf968419de140225a2a7939e33cb8769675d6b1b29609f7676." \
            --prerelease
          gh release delete "$OLD_TAG" --cleanup-tag --yes
          rm -rf _ci_export_674424
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _ci_export_674424
          if ! git diff --cached --quiet; then
            git commit -m "ci-export: clean temporary 6.7.44.24 transfer files [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "FINAL_RELEASE_READY=$NEW_TAG"
