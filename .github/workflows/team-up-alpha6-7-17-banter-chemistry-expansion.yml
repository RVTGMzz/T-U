name: Team Up v0.2.0-alpha.6.7.17 Banter + Chemistry Expansion

on:
  push:
    branches:
      - v0.2-alpha6-7-17-banter-chemistry-expansion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x

      - name: Materialize Alpha 6.7.17 content source
        run: python3 tools/materialize_alpha6717.py

      - name: Build, audit and package Alpha 6.7.17
        run: python3 tools/build_alpha6717.py

      - name: Materialize verified source back to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.17 social content [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.17 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-17-banter-chemistry-expansion
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.17_BANTER_CHEMISTRY_EXPANSION_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.17_BANTER_CHEMISTRY_EXPANSION_TEST.sha256.txt
            BUILD_LOG_ALPHA6717.txt
            SOCIAL_CONTENT_AUDIT_ALPHA6717.md
            SMOKE_TEST_V0_2_ALPHA6_7_17_BANTER_CHEMISTRY_VI.txt
          if-no-files-found: error
