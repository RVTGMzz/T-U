name: Team Up v0.2.0-alpha.6.6.14 Pelipper Capture Safety

on:
  push:
    branches: [ v0.2-alpha6-6-14-pelipper-capture-safety ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.14 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6614.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          capture = (root/'Core/PelipperCaptureSafetyService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          expansion = (root/'Combat/ExpansionSkillService.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          a12 = (root/'ModEntry.Alpha6612.cs').read_text(encoding='utf-8')
          a13 = (root/'ModEntry.Alpha6613.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.14</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.14' in mod
          assert 'Pelipper Capture Safety Sync loaded.' in mod

          for token in [
              'FallbackThreshold = 0.10f',
              'TryGetDamageBudget',
              'ClampDamage',
              'CurrentThreshold',
              'CurrentEnabled',
              'Environment.TickCount64'
          ]:
              assert token in capture, token

          for token in [
              'List<Monster> combatMonsters',
              'List<Monster> monsters = combatMonsters',
              'PelipperCaptureSafetyService.IsProtected(monster)',
              'TryPerformRecovery(npc, member, role, affinity, activeMembers, combatMonsters',
              'PelipperCaptureSafetyService.TryGetDamageBudget(target, out int captureBudget)',
              'captureLimited ? 0f : 0.02f',
              'protectedAfterHit',
              'PelipperCaptureSafetyService.ClampDamage(monster, bonusDamage)',
              'PelipperCaptureSafetyService.ClampDamage(monster, guardDamage)'
          ]:
              assert token in combat, token

          for token in [
              'PelipperCaptureSafetyService.ClampDamage(monster, damage)',
              '!PelipperCaptureSafetyService.IsProtected(monster)',
              'captureLimited ? 0f : 0.02f'
          ]:
              assert token in expansion, token

          # Previous live-test locks must remain.
          for token in [
              'RefreshPelipperCombatTargetsAlpha6613',
              'EnforcePelipperHardQuotaAlpha6613',
              'TrySetPelipperSourceDeploymentAlpha6613'
          ]:
              assert token in a13, token
          for token in ['ShowCurfewFarewellAlpha6613','GetCurfewFarewellAlpha6613']:
              assert token in a12, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.14 source acceptance PASS')
          print('Team-wide Pelipper capture offensive-stop PASS')
          print('Capture damage ceiling / no-crit overshoot PASS')
          print('Heal-support full combat context PASS')
          print('6.6.13 quota/single-target/farewell regressions PASS')
          print('Water/bridge performance regression guard PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.14_PELIPPER_CAPTURE_SAFETY_SYNC_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.14_PELIPPER_CAPTURE_SAFETY_SYNC_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.14' BUILD_LOG.txt
          grep -q 'PELIPPER CAPTURE SAFETY SYNC: ENABLED' BUILD_LOG.txt
          grep -q 'TEAM-WIDE OFFENSIVE STOP AT CAPTURE THRESHOLD: ENABLED' BUILD_LOG.txt
          grep -q 'HEAL / SUPPORT DURING CAPTURE HOLD: ENABLED' BUILD_LOG.txt
          grep -q 'CAPTURE DAMAGE CEILING: ENABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.14 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6614.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_14_PELIPPER_CAPTURE_SAFETY_SYNC_VI.txt .github/workflows/team-up-alpha6-6-14-pelipper-capture-safety.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.14 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-14-pelipper-capture-safety
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-14-pelipper-capture-safety
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.14_PELIPPER_CAPTURE_SAFETY_SYNC_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.14_PELIPPER_CAPTURE_SAFETY_SYNC_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_14_PELIPPER_CAPTURE_SAFETY_SYNC_VI.txt
          if-no-files-found: error
