name: Team Up v0.2.0-alpha.6.7.42 Lower Workings Descent

on:
  push:
    branches:
      - v0.2-alpha6-7-42-lower-workings-descent
    paths:
      - 'tools/materialize_alpha6742.py'
      - 'tools/build_alpha6742.py'
      - '.github/workflows/team-up-alpha6-7-42-lower-workings-descent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Materialize Alpha 6.7.42 Lower Workings descent source
        run: python3 tools/materialize_alpha6742.py
      - name: Build, audit and package Alpha 6.7.42
        run: python3 tools/build_alpha6742.py
      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.42 Lower Workings descent [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload Alpha 6.7.42 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-42-lower-workings-descent
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.42_LOWER_WORKINGS_DESCENT_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.42_LOWER_WORKINGS_DESCENT_TEST.sha256.txt
            BUILD_LOG_ALPHA6742.txt
            LOWER_WORKINGS_DESCENT_AUDIT_ALPHA6742.md
            SMOKE_TEST_V0_2_ALPHA6_7_42_LOWER_WORKINGS_DESCENT_VI.txt
          if-no-files-found: error
