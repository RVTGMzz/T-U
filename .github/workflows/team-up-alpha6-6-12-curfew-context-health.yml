name: Team Up v0.2.0-alpha.6.6.12 Curfew Context Health

on:
  push:
    branches: [ v0.2-alpha6-6-12-curfew-context-health ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.12 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6612.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          curfew = (root/'ModEntry.Alpha6612.cs').read_text(encoding='utf-8')
          health = (root/'ModEntry.Alpha669.cs').read_text(encoding='utf-8')
          overlay = (root/'UI/PartyHealthOverlayService.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.12</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.12' in mod
          assert 'RegisterAlpha6612Events();' in mod
          assert 'Relationship Curfew + Context Health loaded.' in mod

          for token in [
              'Game1.timeOfDay < 2300',
              'GetCurfewTimeAlpha6612',
              'return 2900;',
              'return 2600;',
              'return 2500;',
              'return 2400;',
              'PartyMemberState.Inactive',
              'Follow.ReleaseToVanillaAndResumeSchedule(npc)',
              'CompanionDeploymentState.Standby',
              'PelipperDeploymentStateService.SetDesiredDeployment'
          ]:
              assert token in curfew, token

          for token in [
              'TimeSpan.FromSeconds(3)',
              'currentHealth < previousHealth',
              'bool engaged = isEngaged(member)',
              'bool talking = isTalking(member)',
              'int y = (int)local.Y + 60',
              'member.IsDowned || engaged || talking || heldVisible'
          ]:
              assert token in overlay, token
          assert 'DrawHud(' not in overlay
          assert 'RenderedHud +=' not in health
          for token in ['IsMemberTalkingAlpha669', 'Game1.activeClickableMenu is not null && !Game1.dialogueUp', 'HealthOverlayAlpha669.Reset()']:
              assert token in health, token

          start = follow.index('    private void UpdateCompanionUnits(')
          end = follow.index('    private void FollowTarget(', start)
          body = follow[start:end]
          assert body.index('PelipperTownCompatibilityService.IsSourceControlled(unit)') < body.index('ResolveCharacter(unit.CharacterName)')
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat

          print('Alpha 6.6.12 source acceptance PASS')
          print('Relationship-gated curfew + schedule return PASS')
          print('Linked companion curfew standby PASS')
          print('Under-foot contextual 3-second health PASS')
          print('Persistent left-side HP HUD removal PASS')
          print('6.6.10 Pelipper authority + performance regressions PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.12' BUILD_LOG.txt
          grep -q 'RELATIONSHIP CURFEW: ENABLED' BUILD_LOG.txt
          grep -q 'UNDER-FOOT CONTEXT HEALTH BAR: ENABLED' BUILD_LOG.txt
          echo 'Alpha 6.6.12 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6612.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_VI.txt .github/workflows/team-up-alpha6-6-12-curfew-context-health.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.12 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-12-curfew-context-health
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-12-curfew-context-health
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_12_RELATIONSHIP_CURFEW_CONTEXT_HEALTH_VI.txt
          if-no-files-found: error
