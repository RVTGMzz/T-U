name: Team Up v0.2.0-alpha.6.7.29 Marlon Investigation Reactions

on:
  push:
    branches:
      - v0.2-alpha6-7-29-marlon-investigation-reactions
    paths:
      - 'src/TeamUp/**'
      - 'tools/materialize_alpha6729.py'
      - 'tools/build_alpha6729.py'
      - '.github/workflows/team-up-alpha6-7-29-marlon-investigation-reactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: '6.0.x'

      - name: Materialize Alpha 6.7.29 Marlon investigation source
        run: python3 tools/materialize_alpha6729.py

      - name: Route reaction interaction to expanded story window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/TeamUp/ModEntry.Alpha6728.cs')
          text = p.read_text(encoding='utf-8')
          old = 'MilestoneReactionsAlpha6728.TryConsume(Game1.player, Origin.Stage, npc.Name, out string key)'
          new = 'MilestoneReactionsAlpha6728.TryConsume(Game1.player, GetStoryReactionWindowAlpha6729(), npc.Name, out string key)'
          if old not in text:
              raise RuntimeError('Alpha6728 reaction interaction target missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Build, audit and package Alpha 6.7.29
        run: python3 tools/build_alpha6729.py

      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.29 Marlon investigation + reactions [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.29 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-29-marlon-investigation-reactions
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.29_MARLON_INVESTIGATION_REACTIONS_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.29_MARLON_INVESTIGATION_REACTIONS_TEST.sha256.txt
            BUILD_LOG_ALPHA6729.txt
            MARLON_INVESTIGATION_REACTIONS_AUDIT_ALPHA6729.md
            SMOKE_TEST_V0_2_ALPHA6_7_29_MARLON_INVESTIGATION_VI.txt
          if-no-files-found: error
