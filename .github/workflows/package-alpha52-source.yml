name: Package Alpha 5.2 Source

on:
  push:
    branches:
      - alpha5.2-ux-foundation
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package folder
        run: |
          mkdir -p package/TeamUp_alpha5_2_ONE_CLICK_BUILD
          rsync -a --exclude '.git' --exclude '.github' --exclude 'release' ./ package/TeamUp_alpha5_2_ONE_CLICK_BUILD/

      - name: Create source ZIP
        run: |
          cd package
          zip -r TeamUp_v0.1.0-alpha.5.2_ONE_CLICK_BUILD_SOURCE.zip TeamUp_alpha5_2_ONE_CLICK_BUILD

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TeamUp_v0.1.0-alpha.5.2_ONE_CLICK_BUILD_SOURCE
          path: package/TeamUp_v0.1.0-alpha.5.2_ONE_CLICK_BUILD_SOURCE.zip
          if-no-files-found: error
