name: Team Up v0.2.0-alpha.6.6.26 Single Companion Authority

on:
  push:
    branches:
      - v0.2-alpha6-6-26-single-companion-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Build and audit Alpha 6.6.26
        shell: pwsh
        run: ./BuildV0_2Alpha6626.ps1
      - name: Upload Alpha 6.6.26 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-26-single-companion-authority
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.26_SINGLE_COMPANION_AUTHORITY_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.26_SINGLE_COMPANION_AUTHORITY_TEST.sha256.txt
            BUILD_LOG_ALPHA6626.txt
            SMOKE_TEST_V0_2_ALPHA6_6_26_SINGLE_COMPANION_AUTHORITY_VI.txt
          if-no-files-found: error
