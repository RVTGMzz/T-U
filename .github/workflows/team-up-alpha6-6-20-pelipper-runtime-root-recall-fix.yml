name: Team Up v0.2.0-alpha.6.6.20 Pelipper Runtime Root Recall Fix

on:
  push:
    branches: [ v0.2-alpha6-6-20-pelipper-runtime-root-recall-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.20 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6620Final.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          a17 = (root/'ModEntry.Alpha6617.cs').read_text(encoding='utf-8')
          a19 = (root/'ModEntry.Alpha6619.cs').read_text(encoding='utf-8')
          bridge = (root/'Core/PelipperApiRuntimeRootBridge.cs').read_text(encoding='utf-8')
          locator = (root/'Core/PelipperModRuntimeRootLocator.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.20</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.20' in mod
          assert 'Pelipper Runtime Root + Verified Recall Hotfix loaded.' in mod
          assert 'GetApi<object>' not in a19
          for token in ['Helper.ModRegistry.Get(', 'PelipperModRuntimeRootLocator.TryLocate', 'PelipperApiRuntimeRootBridge.Reset', 'no GetApi<object> retry will be attempted']:
              assert token in a19, token
          for token in ['IsPelipperRuntimeObject', 'value is Mod', 'ReferenceEqualityComparer.Instance']:
              assert token in locator, token
          assert 'runtimeRoot={PelipperApiRuntimeRootBridge.ApiTypeName}' in a17
          assert 'public static void Reset()' in bridge
          forbidden = ['TrySetActorInvisibleAlpha6613(', 'PelipperTownCompatibilityService.SetSuppressed(', '.Halt();', '.controller =', '.temporaryController =']
          for token in forbidden:
              assert token not in a19
              assert token not in bridge
              assert token not in locator
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat
          print('Alpha 6.6.20 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.20' BUILD_LOG.txt
          grep -q 'INVALID GETAPI<OBJECT> RETRY: REMOVED' BUILD_LOG.txt
          grep -q 'PELIPPER MOD RUNTIME ROOT LOCATOR: ENABLED' BUILD_LOG.txt
          grep -q 'NPC RECALL SOURCE-LIVE VERIFICATION: PRESERVED' BUILD_LOG.txt
          echo 'Alpha 6.6.20 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6620.ps1 BuildV0_2Alpha6620Final.ps1 SMOKE_TEST_V0_2_ALPHA6_6_20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_VI.txt .github/workflows/team-up-alpha6-6-20-pelipper-runtime-root-recall-fix.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.20 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-20-pelipper-runtime-root-recall-fix
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-20-pelipper-runtime-root-recall-fix
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_20_PELIPPER_RUNTIME_ROOT_RECALL_FIX_VI.txt
          if-no-files-found: error
