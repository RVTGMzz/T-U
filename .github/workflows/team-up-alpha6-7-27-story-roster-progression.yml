name: Team Up v0.2.0-alpha.6.7.27 Story Roster Progression

on:
  push:
    branches:
      - v0.2-alpha6-7-27-story-roster-progression
    paths:
      - 'src/TeamUp/**'
      - 'tools/materialize_alpha6727.py'
      - 'tools/build_alpha6727.py'
      - '.github/workflows/team-up-alpha6-7-27-story-roster-progression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: '6.0.x'

      - name: Materialize Alpha 6.7.27 story roster source
        run: python3 tools/materialize_alpha6727.py

      - name: Build, audit and package Alpha 6.7.27
        run: python3 tools/build_alpha6727.py

      - name: Materialize verified source back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.27 story roster progression [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload Alpha 6.7.27 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-27-story-roster-progression
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.27_STORY_ROSTER_PROGRESSION_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.27_STORY_ROSTER_PROGRESSION_TEST.sha256.txt
            BUILD_LOG_ALPHA6727.txt
            STORY_ROSTER_PROGRESSION_AUDIT_ALPHA6727.md
            SMOKE_TEST_V0_2_ALPHA6_7_27_STORY_ROSTER_VI.txt
          if-no-files-found: error
