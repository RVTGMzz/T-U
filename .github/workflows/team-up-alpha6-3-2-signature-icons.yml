name: Team Up v0.2.0-alpha.6.3.2 Signature Icons

on:
  push:
    branches: [ v0.2-alpha6-3-2-signature-icons ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.3.2 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha632.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.3.2'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          renderer = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert mod.count(f'Team Up DEBUG HARNESS READY | command: teamup_test | build: v{version}') == 1
          assert 'signature icon art pass loaded' in mod

          assert 'DrawTextTraitBlock' in profile
          assert 'DrawSignatureBlock' in profile
          assert 'TraitIconKind.Passive' not in profile
          assert 'TraitIconKind.Signature' in profile

          assert 'BespokeSignaturePatterns' in renderer
          assert 'BuildProceduralPattern' in renderer
          assert 'HasBespokeSignature' in renderer
          expected = [
              'Abigail','Alex','Harvey','Maru','Emily',
              'Alesia','Andy','Camilla','Claire','Isaac','Jadu','Lance','Martin','Morgan','Olivia','Sophia','Victor',
              'Aguar','Blair','Carmen','Daia','Ian','Jio','June','Kenneth','Kiarra','Maddie','Shiro','Ysabelle'
          ]
          for name in expected:
              assert f'["{name}"] = P(' in renderer, name

          # Alpha 6.3.1 equipment polish must remain materialized.
          assert 'AutoEquipBest()' in equipment
          assert 'DrawRarityFrame' in equipment
          assert 'EquipmentImpactPreview' in equipment

          print('Alpha 6.3.2 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.3.2_SIGNATURE_ICON_ART_PASS_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.3.2_SIGNATURE_ICON_ART_PASS_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.3.2' BUILD_LOG.txt
          echo 'Alpha 6.3.2 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support/IntegrateAlpha632SignatureIcons.ps1 BuildV0_2Alpha632.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_3_2_SIGNATURE_ICONS_VI.txt .github/workflows/team-up-alpha6-3-2-signature-icons.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.3.2 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-3-2-signature-icons
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-3-2-signature-icons
          path: |
            release/TeamUp_v0.2.0-alpha.6.3.2_SIGNATURE_ICON_ART_PASS_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.3.2_SIGNATURE_ICON_ART_PASS_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_3_2_SIGNATURE_ICONS_VI.txt
          if-no-files-found: error
