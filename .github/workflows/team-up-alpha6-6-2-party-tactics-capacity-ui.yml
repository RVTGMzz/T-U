name: Team Up v0.2.0-alpha.6.6.2 Party Tactics Capacity UI

on:
  push:
    branches: [ v0.2-alpha6-6-2-party-tactics-capacity-ui ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.2 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha662.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.6.2'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          alpha661 = (root/'ModEntry.Alpha661.cs').read_text(encoding='utf-8')
          alpha662 = (root/'ModEntry.Alpha662.cs').read_text(encoding='utf-8')
          messages = (root/'Core/MultiplayerMessages.cs').read_text(encoding='utf-8')
          party = (root/'Core/PartyManager.cs').read_text(encoding='utf-8')
          companion = (root/'Core/CompanionUnitData.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          surge = (root/'Combat/MonsterSurgeService.cs').read_text(encoding='utf-8')
          strategy = (root/'Core/PartyStrategy.cs').read_text(encoding='utf-8')
          compat = (root/'Core/CustomNpcCompatibilityService.cs').read_text(encoding='utf-8')
          identity = (root/'Core/CharacterSkillIdentityCatalog.cs').read_text(encoding='utf-8')
          renderer = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          codex = (root/'UI/CodexBrowserMenu.cs').read_text(encoding='utf-8')
          tactics = (root/'UI/PartyTacticsMenu.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          vault = (root/'Storage/PartyVaultService.cs').read_text(encoding='utf-8')
          en = (root/'i18n/default.json').read_text(encoding='utf-8')
          vi = (root/'i18n/vi.json').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'Team Up DEBUG HARNESS READY | command: teamup_test | build: v{version}' in mod
          assert 'Party Tactics + Shared Capacity UI loaded' in mod
          assert 'RegisterAlpha661MultiplayerEvents();' in mod
          assert 'RegisterAlpha662MultiplayerEvents();' in mod
          assert 'RequestStrategyChangeAlpha662(next.Value);' in mod
          assert 'browser => OpenPartyTactics' in mod
          assert 'PartyTacticsMenu' in mod

          for token in ['StrategyRequestTypeAlpha662', 'StrategyStateTypeAlpha662', 'RequestStrategyChangeAlpha662', 'ApplyStrategyAuthoritativeAlpha662', 'BroadcastStrategyStateAlpha662', 'SendStrategyStateAlpha662', 'ClearRemoteCombatServices', 'Strategy request sent to host.', '!Context.IsWorldReady']:
              assert token in alpha662, token
          assert 'Context.IsMainPlayer' in alpha662
          assert 'e.FromPlayerID' in alpha662
          for token in ['StrategyRequestMessage', 'StrategyStateMessage']:
              assert token in messages, token

          for token in ['FocusArea.Tactics', '_tacticsButton', 'Action<CodexBrowserMenu> openTactics', '_openTactics(this)', 'tactics.open']:
              assert token in codex, token
          for token in ['PartyStrategy.Balanced', 'PartyStrategy.Defensive', 'PartyStrategy.Aggressive', 'PartyStrategy.HoldPosition', 'PartyStrategy.BossFocus', 'receiveLeftClick', 'receiveKeyPress', 'receiveGamePadButton', 'tactics.people-value', 'tactics.companion-value', 'tactics.authority-host', 'tactics.authority-client']:
              assert token in tactics, token
          for token in ['"tactics.title"', '"tactics.strategy.boss"', '"tactics.people-value"']:
              assert token in en, token
              assert token in vi, token

          assert 'public int MaxPartyMembers { get; set; } = 6;' in (root/'ModConfig.cs').read_text(encoding='utf-8')
          assert 'public int MaxActiveLinkedCompanions { get; set; } = 2;' in (root/'ModConfig.cs').read_text(encoding='utf-8')
          for token in ['GetSharedPeopleCount', 'EnforceSharedPeopleCapacity', 'Math.Min(6, online.Count)', 'GetAnyOwner', 'GetActiveCombatCompanionCount', 'Math.Clamp(_maxActiveLinkedCompanions(), 0, 2)']:
              assert token in party, token
          assert 'CountsTowardCombatCompanionLimit' in companion
          assert 'Kind == CompanionUnitKind.ExternalCreature' in companion

          for token in ['Ronvotri.TeamUp/PartyControlled', 'Ronvotri.TeamUp/PartyControllerOwner', 'Farmer owner']:
              assert token in follow, token
          for token in ['SetFarmerContext', 'FarmerContext.currentLocation', 'HardLeashTiles = 12f', 'TargetLockDurationTicks = 45', 'FacingHoldDurationTicks = 10']:
              assert token in combat, token
          for token in ['Balanced', 'Defensive', 'Aggressive', 'HoldPosition', 'BossFocus']:
              assert token in strategy, token

          assert 'farmer.friendshipData.ContainsKey(MimiNpcId)' in compat
          assert 'Game1.player.friendshipData.ContainsKey(MimiNpcId)' not in compat
          assert 'SudokuCanonicalNpcId = "ronvotri.HeyYoureCursed_Sudoku"' in compat
          assert 'BROOMTAIL SIGIL' in identity
          assert 'NINEFOLD SEAL' in identity
          assert '[CustomNpcCompatibilityService.MimiNpcId] = P(' in renderer
          assert '[CustomNpcCompatibilityService.SudokuCanonicalNpcId] = P(' in renderer

          for token in ['ActiveInstance', 'LastTelemetryLine', 'DebugReapplyCurrentLocation', 'DebugShowThreatBoard', 'ClearOwnedSurgeMonsters', '[SurgeTelemetry]']:
              assert token in surge, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in surge
          assert 'Activator.CreateInstance' not in surge
          assert 'MemberwiseClone' not in surge
          assert 'OptionalTestHostCompatibility.CardchaArenaLocationName' in surge

          assert 'DoubleClickWindowMs = 450' in equipment
          assert 'public override void releaseLeftClick' in vault
          for token in ['RegisterAlpha661MultiplayerEvents', 'BroadcastPartySnapshot', 'RecruitNpcAuthoritative', 'GetOnlineFarmerIds', 'UpdateOwnedPartyRuntime', 'RemoteCombatServices']:
              assert token in alpha661, token

          print('Alpha 6.6.2 source acceptance PASS')
          print('Party Tactics UI + controller acceptance PASS')
          print('Host-authoritative strategy sync acceptance PASS')
          print('Shared capacity visibility acceptance PASS')
          print('Alpha 6.6.1 capacity/multiplayer regression acceptance PASS')
          print('Strategy/Surge/MiMi/Sudoku/equipment/vault regressions PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.2_PARTY_TACTICS_CAPACITY_UI_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.2_PARTY_TACTICS_CAPACITY_UI_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.2' BUILD_LOG.txt
          grep -q 'TACTICS UI: CODEX ENTRY + CONTROLLER SAFE' BUILD_LOG.txt
          grep -q 'STRATEGY SYNC: HOST AUTHORITATIVE' BUILD_LOG.txt
          grep -q 'CAPACITY UI: SHARED PEOPLE + EXTERNAL COMPANIONS' BUILD_LOG.txt
          echo 'Alpha 6.6.2 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha662.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_6_2_PARTY_TACTICS_CAPACITY_UI_VI.txt .github/workflows/team-up-alpha6-6-2-party-tactics-capacity-ui.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.2 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-2-party-tactics-capacity-ui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-2-party-tactics-capacity-ui
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.2_PARTY_TACTICS_CAPACITY_UI_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.2_PARTY_TACTICS_CAPACITY_UI_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_2_PARTY_TACTICS_CAPACITY_UI_VI.txt
          if-no-files-found: error
