name: Team Up v0.2.0-alpha.6.6.10 Pelipper Follow Authority

on:
  push:
    branches: [ v0.2-alpha6-6-10-pelipper-follow-authority ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.6.10 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha6610.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          follow = (root/'Following/FollowService.cs').read_text(encoding='utf-8')
          deployment = (root/'Core/PelipperDeploymentStateService.cs').read_text(encoding='utf-8')
          alpha663 = (root/'ModEntry.Alpha663.cs').read_text(encoding='utf-8')
          alpha669 = (root/'ModEntry.Alpha669.cs').read_text(encoding='utf-8')
          combat = (root/'Combat/CombatService.cs').read_text(encoding='utf-8')
          tile = (root/'Core/PartyTileSafety.cs').read_text(encoding='utf-8')
          config = (root/'ModConfig.cs').read_text(encoding='utf-8')

          assert '<Version>0.2.0-alpha.6.6.10</Version>' in project
          assert 'build: v0.2.0-alpha.6.6.10' in mod
          assert 'Pelipper Follow Authority Hotfix loaded.' in mod

          start = follow.index('    private void UpdateCompanionUnits(')
          end = follow.index('    private void FollowTarget(', start)
          body = follow[start:end]
          skip = body.index('PelipperTownCompatibilityService.IsSourceControlled(unit)')
          resolve = body.index('ResolveCharacter(unit.CharacterName)')
          assert skip < resolve
          assert 'Skip before resolving the actor' in body

          assert 'desiredState = deployed ? ActiveValue : StandbyValue' in deployment
          assert 'currentState.Equals(desiredState' in deployment
          assert 'currentOwner.Equals(ownerName' in deployment
          assert 'SetSuppressed(actor, owner, true)' not in deployment
          assert 'PelipperTownCompatibilityService.SetSuppressed(' not in alpha663

          for token in ['RenderedWorld', 'RenderedHud', 'BuildHealthSnapshotSignatureAlpha669']:
              assert token in alpha669, token
          assert 'isTileLocationTotallyClearAndPlaceable' not in follow
          assert 'isTileLocationTotallyClearAndPlaceable' not in combat
          for token in ['CombatPathRetryCooldownTicks = 24', 'CombatMovementPulseTicks = 3', 'PartyTileSafety.IsWalkableLandOrBridge(location, tile)']:
              assert token in combat, token
          for token in ['isWaterTile(x, y)', 'GetLayer("Buildings")', 'isTilePassable(tile)']:
              assert token in tile, token

          assert 'public int MaxPartyMembers { get; set; } = 6;' in config
          assert 'public int MaxActiveLinkedCompanions { get; set; } = 2;' in config

          print('Alpha 6.6.10 source acceptance PASS')
          print('Pelipper early skip before actor resolution PASS')
          print('Pelipper source-only movement authority PASS')
          print('Idempotent deployment markers PASS')
          print('6.6.7 performance + 6.6.8 land-safe + 6.6.9 health regression PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.6.10_PELIPPER_FOLLOW_AUTHORITY_HOTFIX_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.6.10_PELIPPER_FOLLOW_AUTHORITY_HOTFIX_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.6.10' BUILD_LOG.txt
          grep -q 'PELIPPER FOLLOW AUTHORITY: SOURCE ONLY' BUILD_LOG.txt
          grep -q 'PELIPPER EARLY SKIP BEFORE ACTOR RESOLUTION: ENABLED' BUILD_LOG.txt
          grep -q 'PELIPPER DEPLOYMENT MARKER WRITES: IDEMPOTENT' BUILD_LOG.txt
          echo 'Alpha 6.6.10 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp BuildV0_2Alpha6610.ps1 SMOKE_TEST_V0_2_ALPHA6_6_10_PELIPPER_FOLLOW_AUTHORITY_VI.txt .github/workflows/team-up-alpha6-6-10-pelipper-follow-authority.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.6.10 source [skip ci]"
            git push origin HEAD:v0.2-alpha6-6-10-pelipper-follow-authority
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-6-10-pelipper-follow-authority
          path: |
            release/TeamUp_v0.2.0-alpha.6.6.10_PELIPPER_FOLLOW_AUTHORITY_HOTFIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.6.10_PELIPPER_FOLLOW_AUTHORITY_HOTFIX_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_6_10_PELIPPER_FOLLOW_AUTHORITY_VI.txt
          if-no-files-found: error
