name: Team Up v0.2.0-alpha.6.7.44.3 Pelipper Runtime Hotfix

on:
  push:
    branches:
      - v0.2-alpha6-7-44-3-pelipper-runtime-hotfix
    paths:
      - 'tools/hotfix_alpha6744_3_runtime.py'
      - 'tools/build_alpha6744_3.py'
      - '.github/workflows/team-up-alpha6-7-44-3-pelipper-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
      - name: Apply Alpha 6.7.44.3 runtime hotfix
        run: python3 tools/hotfix_alpha6744_3_runtime.py
      - name: Build, audit and package Alpha 6.7.44.3
        run: python3 tools/build_alpha6744_3.py
      - name: Commit verified hotfix source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp
          if git diff --cached --quiet; then
            echo "No hotfix source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.7.44.3 Pelipper runtime hotfix [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload Alpha 6.7.44.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-7-44-3-pelipper-runtime-hotfix
          path: |
            release/TeamUp_v0.2.0-alpha.6.7.44.3_PELIPPER_RUNTIME_HOTFIX_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.7.44.3_PELIPPER_RUNTIME_HOTFIX_TEST.sha256.txt
            BUILD_LOG_ALPHA6744_3.txt
            PELIPPER_RUNTIME_HOTFIX_AUDIT_ALPHA6744_3.md
          if-no-files-found: error
