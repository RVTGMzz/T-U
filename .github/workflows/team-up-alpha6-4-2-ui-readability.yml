name: Team Up v0.2.0-alpha.6.4.2 UI Readability

on:
  push:
    branches: [ v0.2-alpha6-4-2-ui-readability ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.4.2 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha642.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.4.2'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          relationship = (root/'Core/RelationshipBondService.cs').read_text(encoding='utf-8')
          progression = (root/'Core/ProgressionService.cs').read_text(encoding='utf-8')
          identity = (root/'Combat/CharacterSkillIdentityService.cs').read_text(encoding='utf-8')
          expansion = (root/'Combat/ExpansionSkillService.cs').read_text(encoding='utf-8')
          renderer = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          party_data = (root/'Core/PartyMemberData.cs').read_text(encoding='utf-8')

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert mod.count(f'Team Up DEBUG HARNESS READY | command: teamup_test | build: v{version}') == 1
          assert 'UI readability pass loaded' in mod

          # Alpha 6.4.2 readability contract.
          assert 'DescriptionScale = BodyScale * 2f' in profile
          assert 'DrawScrollableTraitArea' in profile
          assert 'receiveScrollWheelAction(int direction)' in profile
          assert 'Keys.PageUp' in profile and 'Keys.PageDown' in profile
          assert 'Buttons.LeftThumbstickUp' in profile and 'Buttons.LeftThumbstickDown' in profile
          assert 'DrawDetailsScrollBar' in profile
          assert 'ContainsVertically' in profile
          assert 'DrawProfileDetails(b, rightX, bodyY, rightWidth, bodyBottom - bodyY);' in profile
          assert 'TraitIconKind.Passive' not in profile
          assert 'TraitIconKind.Signature' in profile

          # Relationship 6.4.1 remains intact.
          for token in ['TrustedHearts = 4', 'CloseCompanionHearts = 8', 'MaxFriendshipHearts = 10', 'SoulmateHearts = 14']:
              assert token in relationship, token
          assert 'BuildRoleFallback' in relationship
          assert 'ConfigureRelationshipHooks' in progression
          assert 'GetSignatureEffectMultiplier' in progression
          assert 'RelationshipBond' not in party_data
          assert 'Soulmate' not in party_data

          # Skill/equipment/icon locks remain intact.
          assert 'GetSignatureEffectMultiplier(member, role)' in identity
          assert 'GetSignatureEffectMultiplier(member, role)' in expansion
          assert 'AutoEquipBest()' in equipment
          assert 'DrawRarityFrame' in equipment
          for name in ['Abigail','Alex','Harvey','Maru','Emily','Caroline','Wizard','Alesia','Ysabelle']:
              assert f'["{name}"] = P(' in renderer, name

          print('Alpha 6.4.2 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.4.2_UI_READABILITY_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.4.2_UI_READABILITY_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.4.2' BUILD_LOG.txt
          echo 'Alpha 6.4.2 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support/IntegrateAlpha642UiReadability.ps1 BuildV0_2Alpha642.ps1 BUILD_V0_2_ALPHA6.bat SMOKE_TEST_V0_2_ALPHA6_4_2_UI_READABILITY_VI.txt .github/workflows/team-up-alpha6-4-2-ui-readability.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.4.2 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-4-2-ui-readability
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-4-2-ui-readability
          path: |
            release/TeamUp_v0.2.0-alpha.6.4.2_UI_READABILITY_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.4.2_UI_READABILITY_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_4_2_UI_READABILITY_VI.txt
          if-no-files-found: error
