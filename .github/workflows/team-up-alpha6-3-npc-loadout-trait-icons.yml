name: Team Up v0.2.0-alpha.6.3.0 NPC Loadout + Trait Icons

on:
  push:
    branches: [ v0.2-alpha6-3-npc-loadout-trait-icons ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build Alpha 6.3 end-to-end
        shell: pwsh
        run: |
          ./BuildV0_2Alpha63.ps1

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('src/TeamUp')
          version = '0.2.0-alpha.6.3.0'
          project = (root/'TeamUp.csproj').read_text(encoding='utf-8')
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          equipment = (root/'UI/EquipmentMenu.cs').read_text(encoding='utf-8')
          profile = (root/'UI/CharacterProfileMenu.cs').read_text(encoding='utf-8')
          icons = (root/'UI/TraitIconRenderer.cs').read_text(encoding='utf-8')
          preview = (root/'Core/EquipmentPreviewService.cs').read_text(encoding='utf-8')
          en = json.loads((root/'i18n/default.json').read_text(encoding='utf-8-sig'))
          vi = json.loads((root/'i18n/vi.json').read_text(encoding='utf-8-sig'))

          assert f'<Version>{version}</Version>' in project
          assert f'build: v{version}' in mod
          assert 'private const int InventoryColumns = 6;' in equipment
          assert 'item.drawInMenu(' in equipment
          assert 'DrawHoverComparison' in equipment
          assert 'EquipmentPreviewService.BuildPreview' in equipment
          assert 'TraitIconRenderer.TraitIconKind.Passive' in profile
          assert 'TraitIconRenderer.TraitIconKind.Signature' in profile
          assert 'StableHash' in icons and 'BuildPattern' in icons
          assert 'BuildPreview' in preview
          assert en.get('equipment.compare-title')
          assert vi.get('equipment.compare-title')
          print('Alpha 6.3 source acceptance PASS')
          PY

      - name: Verify packaged build
        shell: bash
        run: |
          set -euo pipefail
          test -s release/TeamUp_v0.2.0-alpha.6.3.0_NPC_LOADOUT_TRAIT_ICONS_TEST.zip
          test -s release/TeamUp_v0.2.0-alpha.6.3.0_NPC_LOADOUT_TRAIT_ICONS_TEST.sha256.txt
          grep -q 'BUILD SUCCESS - ALPHA 6.3.0' BUILD_LOG.txt || true
          echo 'Alpha 6.3 package verification PASS'

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TeamUp _build_support BuildV0_2Alpha63.ps1 BUILD_V0_2_ALPHA6.bat .github/workflows/team-up-alpha6-3-npc-loadout-trait-icons.yml
          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize Team Up v0.2.0-alpha.6.3.0 build source [skip ci]"
            git push origin HEAD:v0.2-alpha6-3-npc-loadout-trait-icons
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: team-up-alpha6-3-npc-loadout-trait-icons
          path: |
            release/TeamUp_v0.2.0-alpha.6.3.0_NPC_LOADOUT_TRAIT_ICONS_TEST.zip
            release/TeamUp_v0.2.0-alpha.6.3.0_NPC_LOADOUT_TRAIT_ICONS_TEST.sha256.txt
            BUILD_LOG.txt
            SMOKE_TEST_V0_2_ALPHA6_3_NPC_LOADOUT_VI.txt
          if-no-files-found: error
